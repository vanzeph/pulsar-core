# Momentum + low-volatility + short-term reversal, IC-weighted.
#
# Mirrors the canonical experiment shape of the core-engine design
# (因子库与实验配置). The universe here is an explicit symbol list so the
# file is self-contained; registered universe names
# (`experiment.universe = "hs300"`) work the same way once a universe is
# registered with `register_universe`.

[experiment]
id = "momentum_value_2026q4"
description = "momentum / low-vol / reversal combo, IC-weighted, top-2 monthly"

[universe]
symbols = ["600000", "600009", "600016", "600028", "600030"]

[factors]
names = ["momentum_20", "volatility_20", "reversal_5"]
preprocess = ["winsorize", "zscore"]

[model]
type = "ic_weighted"
params = { lookback = 60, horizon = 5, min_points = 10 }

[portfolio]
method = "top_n"
top_n = 2
rebalance = "monthly"

[backtest]
start = 2026-04-01
end = 2026-09-30
costs = "a_share_default"
seed = 7
